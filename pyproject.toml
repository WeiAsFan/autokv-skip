[project]
name = "autokv-skip"
version = "0.1.0"
description = "Driver-locked AutoKV-Skip experiment controller for vLLM"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
autokv = "autokv.cli:main"

[tool.setuptools.packages.find]
include = ["autokv*"]
